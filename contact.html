<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advit Goel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <a href="index.html" id="nametag">
            <img src="avatar.png" alt="Profile Picture" id="avatarimg">
            <h3 id="name">Advit Goel</h3>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="navlinks">
            <a href="index.html" class="headericons">Home</a>
            <a href="about.html" class="headericons">About Me</a>
            <a href="resume.html" class="headericons">Resume</a>
            <a href="projects.html" class="headericons">Projects</a>
            <a href="contact.html" class="headericons active">Contact</a>
        </div>
    </header>

    <main class="circlediv">
        <svg class="contact-illustration" viewBox="0 0 800 800">
            <g transform="scale(1.53)">
                <rect x="156" y="136" width="280" height="190" rx="10" fill="#1E2A4A"/>
                <rect x="140" y="120" width="280" height="190" rx="10" fill="#F6F3E7" stroke="#1E2A4A" stroke-width="6"/>
                <path d="M140,126 L280,222 L420,126" fill="none" stroke="#1E2A4A" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
                <circle class="floaty" cx="396" cy="150" r="28" fill="#C9A24B" stroke="#1E2A4A" stroke-width="4"/>
                <circle class="floaty" cx="110" cy="100" r="16" fill="none" stroke="#C9A24B" stroke-width="4"/>
                <rect x="90" y="330" width="26" height="26" rx="4" fill="#3F5A2C" opacity="0.35" transform="rotate(18 103 343)"/>
                <circle class="floaty" cx="440" cy="370" r="7" fill="#C9A24B" opacity="0.5"/>
                <circle class="floaty" cx="70" cy="230" r="5" fill="#3F5A2C" opacity="0.4"/>
            </g>
        </svg>

        <div class="contact-text">
            <h1 id="getintouch">GET IN TOUCH</h1>

            <div id="contact">
                <!--
                  There's no backend here to receive a real form submission,
                  so script.js intercepts this instead and opens a pre-filled
                  mailto: link — whatever mail app is set as default on the
                  visitor's device (Gmail's app on most phones, Gmail in the
                  browser on desktop if that's their default, or something
                  else entirely) opens with this message ready for THEM to
                  hit send on. Nothing is sent automatically from the site.
                -->
                <form id="contact-form">
                    <input class="inputname" type="text" id="contact-name" placeholder="John Doe" required>
                    <input class="inputname" type="email" id="contact-email" placeholder="you@example.com" required>
                    <textarea class="inputname" id="contact-message" placeholder="What's on your mind?" required></textarea>
                    <input type="submit" value="Submit" id="submit">
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span class="copyright">© 2026 Advit Goel. All rights reserved.</span>
        <div class="socials">
            <a href="https://github.com/coolgoel1">
                <img src="./github.png" alt="GitHub" width="35" height="35" style="border-radius:50%;">
            </a>
            <a href="https://linkedin.com/in/advit-goel">
                <img src="./lnkd.png" alt="LinkedIn" width="35" height="35" style="border-radius:50%;">
            </a>
        </div>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
