    <main class="circlediv">
        <svg class="contact-illustration" viewBox="0 0 800 800">
            <g transform="scale(1.53)">
                <rect x="156" y="136" width="280" height="190" rx="10" fill="#1E2A4A"/>
                <rect x="140" y="120" width="280" height="190" rx="10" fill="#F6F3E7" stroke="#1E2A4A" stroke-width="6"/>

        <div class="contact-text">
            <h1 id="getintouch">GET IN TOUCH</h1>

            <div id="contact">

                    <input class="inputname" type="email" placeholder="you@example.com" required>
